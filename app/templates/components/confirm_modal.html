<div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
  <div class="modal-box">
    <h3 id="confirm-modal-title" class="modal-title">Confirm Action</h3>
    <p id="confirm-message" class="modal-message">Are you sure?</p>
    <div class="modal-actions">
      <button type="button" id="confirm-no" class="btn btn-secondary"><i data-feather="x"></i> Cancel</button>
      <button type="button" id="confirm-yes" class="btn btn-danger"><i data-feather="trash-2"></i> Confirm</button>
    </div>
  </div>
</div>

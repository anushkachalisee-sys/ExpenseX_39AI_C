{# message, action_url (optional), action_label (optional), action_icon (optional) #}
<div class="empty-state">
  <div class="empty-state-icon" aria-hidden="true"><i data-feather="{{ icon|default('inbox') }}"></i></div>
  <p class="empty-state-message">{{ message }}</p>
  {% if action_url and action_label %}
  <a href="{{ action_url }}" class="btn btn-primary">
    {% if action_icon %}<i data-feather="{{ action_icon }}"></i>{% endif %}
    {{ action_label }}
  </a>
  {% endif %}
</div>
